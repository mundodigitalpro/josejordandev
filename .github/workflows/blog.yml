# Regenera el blog cuando cambia una nota (posts/*.md) o el generador, y sube
# el resultado a main. Así se puede publicar una nota desde la web de GitHub
# sin ejecutar nada en local; Cloudflare despliega ese commit como cualquier otro.
name: Blog

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'tools/build-blog.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the blog
        run: node tools/build-blog.mjs

      - name: Commit the generated files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The generated blog was already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog en/blog sitemap.xml
          git commit -m "Rebuild blog"
          git push
